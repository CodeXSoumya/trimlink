app = "trimlink-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "gateway"
  SERVER_PORT = "8080"
  TRIMLINK_NODE_SCHEME = "http"
  TRIMLINK_NODE_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
