networks:
  trimlink-network:
    driver: bridge

services:
  # ==========================================
  # COORDINATOR: Apache ZooKeeper
  # ==========================================
  zookeeper-service:
    image: zookeeper:3.9.0
    container_name: zookeeper-service
    ports:
      - "2181:2181"
    networks:
      - trimlink-network

  # ==========================================
  # L1 HIGH-SPEED CACHE: Redis
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    command: redis-server --port 6373 --requirepass secure_redis_password
    ports:
      - "6373:6373"
    networks:
      - trimlink-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6373", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # L2 STORAGE TIER: 3 Independent DB Shards
  # ==========================================
  postgres-shard-0:
    image: postgres:15-alpine
    container_name: postgres-shard-0
    environment:
      POSTGRES_DB: trimlink_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secure_db_password
    ports:
      - "5433:5432"
    networks:
      - trimlink-network

  postgres-shard-1:
    image: postgres:15-alpine
    container_name: postgres-shard-1
    environment:
      POSTGRES_DB: trimlink_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secure_db_password
    ports:
      - "5434:5432"
    networks:
      - trimlink-network

  postgres-shard-2:
    image: postgres:15-alpine
    container_name: postgres-shard-2
    environment:
      POSTGRES_DB: trimlink_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secure_db_password
    ports:
      - "5435:5432"
    networks:
      - trimlink-network

  # ==========================================
  # ENTRY EDGE ROUTER: API Gateway
  # ==========================================
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=gateway
      - ZOOKEEPER_SERVER=zookeeper-service:2181
    depends_on:
      - zookeeper-service
    networks:
      - trimlink-network

  # ==========================================
  # COMPUTE FLOCK: 5 Active Processing Nodes
  # ==========================================
  node-1: &node-template
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6373
      - ZOOKEEPER_SERVER=zookeeper-service:2181
      - DB_USERNAME=postgres_user
      - DB_PASSWORD=secure_db_password
    depends_on:
      zookeeper-service:
        condition: service_started
      redis-cache:
        condition: service_healthy
      postgres-shard-0:
        condition: service_started
      postgres-shard-1:
        condition: service_started
      postgres-shard-2:
        condition: service_started
    networks:
      - trimlink-network

  node-2:
    <<: *node-template
  node-3:
    <<: *node-template
  node-4:
    <<: *node-template
  node-5:
    <<: *node-template