name: PR CI

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Test and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Package application
        run: ./mvnw -B -DskipTests package

  smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for gateway readiness
        shell: bash
        run: |
          set -euo pipefail
          attempts=60
          for i in $(seq 1 "$attempts"); do
            if curl -sS -o /dev/null -w "%{http_code}" "http://localhost:8080/api/v1/resolve/nonexistent" | grep -Eq "404|500|503"; then
              echo "Gateway responded on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "Gateway did not become reachable in time"
          exit 1

      - name: Verify frontend is serving
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:3000/")
          if [ "$code" -ne 200 ]; then
            echo "Frontend returned HTTP $code"
            exit 1
          fi

      - name: Smoke write and resolve flow
        shell: bash
        run: |
          set -euo pipefail
          short_code=$(curl -sS -X POST "http://localhost:8080/api/v1/shorten?longUrl=https://example.com/ci" -H "X-Client-ID: github-actions-ci")
          if [ -z "$short_code" ]; then
            echo "Short code response was empty"
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:8080/api/v1/resolve/$short_code")
          if [ "$status" -ne 302 ]; then
            echo "Expected 302 from resolve endpoint, got $status"
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v

  pr-summary:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - smoke
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Post or update PR status comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- trimlink-pr-ci-summary -->';
            const statusIcon = (status) => {
              if (status === 'success') return '✅';
              if (status === 'failure') return '❌';
              if (status === 'cancelled') return '⚪';
              return '⚠️';
            };

            const frontend = '${{ needs.frontend.result }}';
            const backend = '${{ needs.backend.result }}';
            const smoke = '${{ needs.smoke.result }}';

            const body = `${marker}
            ## TrimLink PR CI Summary

            - ${statusIcon(frontend)} Frontend Lint and Build: **${frontend}**
            - ${statusIcon(backend)} Backend Test and Package: **${backend}**
            - ${statusIcon(smoke)} Compose Smoke Test: **${smoke}**

            Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              core.info('Updated existing CI summary comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
              core.info('Created new CI summary comment.');
            }
